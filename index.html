<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">

<title>SEWORA MART - Everything For You</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f6fa;
    color: #222;
}

header {
    background: #111827;
    color: white;
    padding: 16px;
    position: sticky;
    top: 0;
    z-index: 100;
}

.top {
    max-width: 1200px;
    margin: auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 23px;
    font-weight: bold;
    color: #facc15;
}

.cart-btn {
    background: #facc15;
    border: none;
    padding: 11px 16px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
}

.hero {
    background: linear-gradient(120deg,#111827,#374151);
    color: white;
    padding: 55px 20px;
    text-align: center;
}

.hero h1 {
    font-size: 35px;
    margin-bottom: 12px;
}

.hero p {
    color: #ddd;
    margin-bottom: 20px;
}

.hero button {
    background: #facc15;
    border: none;
    padding: 13px 25px;
    border-radius: 7px;
    font-weight: bold;
    cursor: pointer;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 25px 15px;
}

.search {
    width: 100%;
    padding: 15px;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 16px;
    margin-bottom: 22px;
}

.categories {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 20px;
}

.category {
    border: none;
    background: white;
    padding: 12px 18px;
    border-radius: 20px;
    white-space: nowrap;
    cursor: pointer;
}

.category.active {
    background: #111827;
    color: white;
}

.section-title {
    margin: 15px 0 20px;
    font-size: 23px;
}

.products {
    display: grid;
    grid-template-columns: repeat(2,1fr);
    gap: 15px;
}

.card {
    background: white;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 2px 10px #00000010;
}

.card img {
    width: 100%;
    height: 160px;
    object-fit: cover;
    background: #eee;
}

.card-info {
    padding: 12px;
}

.card h3 {
    font-size: 15px;
    margin-bottom: 8px;
}

.price {
    color: #e69b00;
    font-weight: bold;
    font-size: 17px;
    margin-bottom: 10px;
}

.add-btn {
    background: #111827;
    color: white;
    border: none;
    padding: 11px;
    width: 100%;
    border-radius: 7px;
    cursor: pointer;
}

.add-btn:active {
    background: #374151;
}

.empty {
    text-align: center;
    padding: 35px;
    color: #777;
    grid-column: 1/-1;
}

/* CART */

.cart-panel {
    position: fixed;
    top: 0;
    right: -100%;
    width: 100%;
    max-width: 420px;
    height: 100%;
    background: white;
    z-index: 500;
    transition: 0.3s;
    padding: 20px;
    overflow-y: auto;
    box-shadow: -5px 0 20px #0002;
}

.cart-panel.open {
    right: 0;
}

.cart-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.close-btn {
    background: #eee;
    border: none;
    padding: 9px 13px;
    border-radius: 7px;
    cursor: pointer;
}

.cart-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #eee;
    padding: 14px 0;
    gap: 10px;
}

.cart-item h4 {
    font-size: 14px;
}

.qty {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
}

.qty button {
    width: 27px;
    height: 27px;
    border: none;
    background: #eee;
    border-radius: 5px;
    cursor: pointer;
}

.remove {
    color: red;
    border: none;
    background: none;
    cursor: pointer;
}

.total {
    font-size: 20px;
    font-weight: bold;
    margin: 25px 0;
}

.checkout {
    width: 100%;
    padding: 15px;
    background: #16a34a;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: #0008;
    z-index: 400;
}

.overlay.show {
    display: block;
}

/* FOOTER */

footer {
    background: #111827;
    color: white;
    text-align: center;
    padding: 30px 15px;
    margin-top: 45px;
}

footer p {
    margin-top: 10px;
    color: #bbb;
}

@media(min-width:600px) {
    .products {
        grid-template-columns: repeat(3,1fr);
    }
}

@media(min-width:900px) {
    .products {
        grid-template-columns: repeat(4,1fr);
    }
}
</style>
</head>

<body>

<header>
    <div class="top">
        <div class="logo">SEWORA MART</div>

        <button class="cart-btn" onclick="openCart()">
            🛒 Cart (<span id="cartCount">0</span>)
        </button>
    </div>
</header>

<section class="hero">
    <h1>EVERYTHING FOR YOU</h1>
    <p>Discover amazing products at great prices.</p>

    <button onclick="document.getElementById('shop').scrollIntoView({behavior:'smooth'})">
        SHOP NOW
    </button>
</section>

<main class="container" id="shop">

    <input
        type="search"
        id="search"
        class="search"
        placeholder="🔍 Search products..."
        oninput="renderProducts()"
    >

    <div class="categories" id="categories"></div>

    <h2 class="section-title">Our Products</h2>

    <div class="products" id="products"></div>

</main>

<!-- CART OVERLAY -->

<div class="overlay" id="overlay" onclick="closeCart()"></div>

<!-- CART PANEL -->

<div class="cart-panel" id="cartPanel">

    <div class="cart-header">
        <h2>My Shopping Cart</h2>

        <button class="close-btn" onclick="closeCart()">✕</button>
    </div>

    <div id="cartItems"></div>

    <div class="total">
        Total: Rs. <span id="cartTotal">0</span>
    </div>

    <button class="checkout" onclick="checkout()">
        Order Through WhatsApp
    </button>

</div>

<footer>
    <h2>SEWORA MART</h2>

    <p>EVERYTHING FOR YOU</p>

    <p>Online Shopping Sri Lanka</p>

    <p>Contact: +94 76 862 6332</p>

    <p>© 2026 SEWORA MART. All Rights Reserved.</p>
</footer>

<script>

// PRODUCT DATABASE
// These are sample products for the first version.

const products = [

    {
        id: 1,
        name: "Kitchen Rack",
        price: 2500,
        category: "Kitchen",
        image: "https://images.unsplash.com/photo-1556911220-bff31c812dba?w=500"
    },

    {
        id: 2,
        name: "Storage Organizer",
        price: 1800,
        category: "Home",
        image: "https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?w=500"
    },

    {
        id: 3,
        name: "Water Bottle",
        price: 950,
        category: "Accessories",
        image: "https://images.unsplash.com/photo-1602143407151-7111542de6e8?w=500"
    },

    {
        id: 4,
        name: "Table Lamp",
        price: 3200,
        category: "Home",
        image: "https://images.unsplash.com/photo-1507473885765-e6ed057f782c?w=500"
    },

    {
        id: 5,
        name: "Kitchen Utensils",
        price: 1500,
        category: "Kitchen",
        image: "https://images.unsplash.com/photo-1556911220-e15b29be8c8f?w=500"
    },

    {
        id: 6,
        name: "Travel Bag",
        price: 4500,
        category: "Accessories",
        image: "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=500"
    },

    {
        id: 7,
        name: "Home Decor",
        price: 2200,
        category: "Home",
        image: "https://images.unsplash.com/photo-1616486338812-3dadae4b4ace?w=500"
    },

    {
        id: 8,
        name: "Storage Basket",
        price: 1200,
        category: "Kitchen",
        image: "https://images.unsplash.com/photo-1593085260707-5377ba37f868?w=500"
    }

];

let cart = [];
let activeCategory = "All";

// CATEGORY BUTTONS

function renderCategories() {

    const categories = [
        "All",
        ...new Set(products.map(p => p.category))
    ];

    document.getElementById("categories").innerHTML =
        categories.map(category => `
            <button
                class="category ${activeCategory === category ? 'active' : ''}"
                onclick="selectCategory('${category}')">
                ${category}
            </button>
        `).join("");
}

function selectCategory(category) {

    activeCategory = category;

    renderCategories();
    renderProducts();

}

// DISPLAY PRODUCTS

function renderProducts() {

    const search = document
        .getElementById("search")
        .value.toLowerCase();

    const filtered = products.filter(product => {

        const matchesSearch =
            product.name.toLowerCase().includes(search);

        const matchesCategory =
            activeCategory === "All" ||
            product.category === activeCategory;

        return matchesSearch && matchesCategory;

    });

    const container = document.getElementById("products");

    if (filtered.length === 0) {

        container.innerHTML =
            '<div class="empty">No products found.</div>';

        return;
    }

    container.innerHTML = filtered.map(product => `

        <div class="card">

            <img
                src="${product.image}"
                alt="${product.name}"
                onerror="this.src='https://placehold.co/500x400?text=SEWORA+MART'"
            >

            <div class="card-info">

                <h3>${product.name}</h3>

                <div class="price">
                    Rs. ${product.price.toLocaleString("en-US")}
                </div>

                <button
                    class="add-btn"
                    onclick="addToCart(${product.id})">
                    Add to Cart
                </button>

            </div>

        </div>

    `).join("");

}

// ADD TO CART

function addToCart(id) {

    const product = products.find(p => p.id === id);

    const existing = cart.find(item => item.id === id);

    if (existing) {
        existing.quantity++;
    } else {
        cart.push({
            ...product,
            quantity: 1
        });
    }

    updateCart();

}

// CHANGE QUANTITY

function changeQuantity(id, amount) {

    const item = cart.find(p => p.id === id);

    if (!item) return;

    item.quantity += amount;

    if (item.quantity <= 0) {
        cart = cart.filter(p => p.id !== id);
    }

    updateCart();

}

// REMOVE ITEM

function removeItem(id) {

    cart = cart.filter(p => p.id !== id);

    updateCart();

}

// UPDATE CART

function updateCart() {

    const count = cart.reduce(
        (sum, item) => sum + item.quantity,
        0
    );

    const total = cart.reduce(
        (sum, item) => sum + item.price * item.quantity,
        0
    );

    document.getElementById("cartCount").innerText = count;

    document.getElementById("cartTotal").innerText =
        total.toLocaleString("en-US");

    const container = document.getElementById("cartItems");

    if (cart.length === 0) {

        container.innerHTML =
            '<p class="empty">Your cart is empty.</p>';

        return;
    }

    container.innerHTML = cart.map(item => `

        <div class="cart-item">

            <div>

                <h4>${item.name}</h4>

                <p>Rs. ${item.price.toLocaleString("en-US")}</p>

                <div class="qty">

                    <button onclick="changeQuantity(${item.id},-1)">−</button>

                    <span>${item.quantity}</span>

                    <button onclick="changeQuantity(${item.id},1)">+</button>

                </div>

            </div>

            <button
                class="remove"
                onclick="removeItem(${item.id})">
                Remove
            </button>

        </div>

    `).join("");

}

// OPEN CART

function openCart() {

    document.getElementById("cartPanel").classList.add("open");

    document.getElementById("overlay").classList.add("show");

}

// CLOSE CART

function closeCart() {

    document.getElementById("cartPanel").classList.remove("open");

    document.getElementById("overlay").classList.remove("show");

}

// WHATSAPP CHECKOUT

function checkout() {

    if (cart.length === 0) {

        alert("Your cart is empty!");

        return;
    }

    let message = "Hello SEWORA MART! I want to place an order:%0A%0A";

    let total = 0;

    cart.forEach(item => {

        const subtotal = item.price * item.quantity;

        total += subtotal;

        message +=
            item.name +
            " x " +
            item.quantity +
            " = Rs. " +
            subtotal +
            "%0A";

    });

    message +=
        "%0A*Total: Rs. " +
        total.toLocaleString("en-US") +
        "*";

    const phone = "94768626332";

    const url =
        "https://wa.me/" + phone + "?text=" + message;

    window.open(url, "_blank");

}

// INITIALIZE APP

renderCategories();
renderProducts();
updateCart();

</script>

</body>
</html>
